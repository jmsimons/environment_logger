<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Climate Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <main data-average-url="{{ url_for('average_api') }}">
        <h1>Climate Logger</h1>
        <p id="status">Waiting for sensor 0 readings...</p>
        
        <section id="sensor" class="readings" hidden>
            <h2>Temperature & Humidity Sensor · AM2302</h2>

            <div class="reading"><span id="temperature-f" class="value">--°</span><span class="label">Fahrenheit</span></div>
            <div class="reading"><span id="humidity-percent" class="value">--%</span><span class="label">Relative humidity</span></div>
            
            <footer id="sensor-details" class="details" hidden>
                <span id="temperature-c"></span>
                <span id="sample-count"></span><br>
                Observed <time id="timestamp-local"></time>
            </footer>
        </section>
        
        
        <section class="readings weather">
            <h2>LOCAL WEATHER</h2>

            <p id="weather-status">Local weather unavailable.</p>
            <div class="reading"><span id="outdoor-temperature-f" class="value">--°</span><span id="weather-description" class="label">Unavailable</span></div>
            <div class="reading"><span id="outdoor-humidity-percent" class="value">--%</span><span class="label">Relative humidity</span></div>
            
            <footer id="weather-details" class="details" hidden>
                <span id="outdoor-temperature-c"></span><br>
                Observed <time id="outdoor-timestamp-local"></time> ·
                <a href="https://open-meteo.com/" rel="external">Weather by Open-Meteo</a>
            </footer>
        </section>

        <nav class="page-nav" aria-label="Climate logger views">
            <a href="{{ url_for('sensor_readings') }}">Sensor reading history</a> ·
            <a href="{{ url_for('runtime_log') }}">Runtime log</a>
        </nav>
    </main>
</body>
</html>
